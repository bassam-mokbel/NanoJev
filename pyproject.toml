[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanojev"
version = "0.1.0"
description = "A 0.6B parallel decision model: states and typed questions in, complete probability distributions out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenJev contributors" }]
requires-python = ">=3.11"
keywords = ["decision model", "calibration", "probabilistic classification", "qwen", "jev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds only. requirements-*.txt keep the exact versions behind the recorded results.
# Install a CUDA (or Jetson) build of torch first if pip's default wheel does not fit your machine.
dependencies = [
  "torch>=2.5",
  # The released backbone config stores RoPE under `rope_parameters`; 4.x silently ignores it.
  "transformers>=5.17",
  "safetensors>=0.8",
  "huggingface_hub>=1.0",
  "qupa-datatypes",
]

[project.optional-dependencies]
# Headless ViZDoom environments for the shooting tasks.
vizdoom = ["vizdoom==1.3.0", "gymnasium==1.3.0"]
# CPU replay and sprite export for the shooting demo.
replay = ["vizdoom==1.3.0", "Pillow>=12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nanojev = "nanojev.cli:main"

[project.urls]
Upstream = "https://github.com/TianyuCodings/NanoJev"
Model = "https://huggingface.co/C-Tianyu/NanoJev"
Dataset = "https://huggingface.co/datasets/C-Tianyu/NanoJev-Data"

[tool.setuptools]
# The research scripts stay where they are, byte for byte: their source hashes are recorded in
# results/, research/ and configs/, and 25 scripts import these modules as flat siblings.
# The reusable core installs as top-level modules beside a thin `nanojev` package.
package-dir = { "" = "scripts", "nanojev" = "src/nanojev" }
packages = ["nanojev"]
py-modules = [
  "predict_toy_decisions",
  "train_toy_decisions",
  "train_pipeline_decisions",
  "calibrated_objectives",
  "serve_decisions",
  "prepare_survey_data",
  "train_survey_decisions",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["scripts", "src"]

[tool.ruff.lint]
# Errors only (syntax, undefined names, invalid comparisons). Style rules would demand edits to
# hash-recorded research scripts.
select = ["E9", "F63", "F7", "F82"]

[tool.uv.sources]
qupa-datatypes = { editable = true, path = "../qupa-datatypes" }
